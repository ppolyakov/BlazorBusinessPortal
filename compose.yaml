name: business-portal

services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: business_portal
      POSTGRES_USER: business_portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - business_portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_portal -d business_portal"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate", "--seed"]
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=business_portal;Username=business_portal;Password=${POSTGRES_PASSWORD}
      SeedDemoData: "true"
      DemoPassword: ${DEMO_PASSWORD:?Copy .env.example to .env and set DEMO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=business_portal;Username=business_portal;Password=${POSTGRES_PASSWORD}
      SeedDemoData: "false"
      DataProtectionKeysPath: /app/keys
    volumes:
      - business_portal_keys:/app/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "BusinessPortal.Web.dll", "--healthcheck"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6

volumes:
  business_portal_postgres:
  business_portal_keys:
