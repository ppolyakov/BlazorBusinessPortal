name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - name: Restore
        run: dotnet restore BusinessPortal.sln
      - name: Verify formatting
        run: dotnet format BusinessPortal.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build BusinessPortal.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BusinessPortal.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Audit NuGet packages
        run: dotnet list BusinessPortal.sln package --vulnerable --include-transitive
      - name: Build Docker image
        run: docker build --tag business-portal:ci .
